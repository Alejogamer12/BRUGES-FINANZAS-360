<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087a50" />
    <meta name="description" content="Descarga BRUGES FINANZAS 360 para Android y Windows." />
    <title>Descarga BRUGES FINANZAS 360</title>
    <link rel="icon" type="image/svg+xml" href="./bruges_finanzas_360.svg" />
    <style>
      :root { color-scheme: light; --green: #087a50; --green-dark: #07583c; --ink: #183329; --muted: #596a62; --line: #dce7df; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--ink); background: linear-gradient(180deg, #f2f8f3 0%, #fff 66%); font: 16px/1.55 system-ui, sans-serif; }
      main { width: min(650px, 100%); padding: clamp(26px, 6vw, 54px); border: 1px solid var(--line); border-radius: 26px; background: #fff; box-shadow: 0 18px 60px #123b2112; text-align: center; }
      .brand { width: 82px; height: 82px; margin: 0 auto 20px; border-radius: 20px; }
      .eyebrow { margin: 0 0 8px; color: var(--green); font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; color: #173c2d; font-size: clamp(1.85rem, 6vw, 2.8rem); line-height: 1.12; }
      .intro { max-width: 470px; margin: 16px auto 28px; color: var(--muted); font-size: 1.05rem; }
      .downloads { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .download { min-height: 70px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border: 2px solid var(--green); border-radius: 15px; color: white; background: var(--green); font-size: 1rem; font-weight: 750; text-decoration: none; transition: background .15s, transform .15s; }
      .download:hover, .download:focus-visible { border-color: var(--green-dark); background: var(--green-dark); transform: translateY(-2px); outline: 3px solid #087a5030; outline-offset: 2px; }
      .download[aria-disabled="true"] { opacity: .55; pointer-events: none; }
      .status { min-height: 24px; margin: 16px 0 0; color: var(--muted); font-size: .9rem; }
      .beta { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; color: #604b17; background: #fff6d9; font-size: .9rem; }
      .upcoming { margin: 28px 0 0; padding-top: 18px; border-top: 1px solid var(--line); color: #738178; font-weight: 650; }
      [hidden] { display: none !important; }
      @media (max-width: 520px) { body { padding: 14px; } main { padding: 28px 20px; } .downloads { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="./bruges_finanzas_360.svg" alt="BRUGES FINANZAS 360" />
      <p class="eyebrow">Tus finanzas, bajo tu control</p>
      <h1>Descarga BRUGES FINANZAS 360</h1>
      <p class="intro">Descarga la versión publicada para tu equipo.</p>
      <div id="downloads" class="downloads">
        <a id="android" class="download" href="#" aria-disabled="true">Android — Descargar APK</a>
        <a id="windows" class="download" href="#" aria-disabled="true">Windows — Descargar Windows</a>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Buscando la versión disponible…</p>
      <p id="beta" class="beta" hidden>Versión beta: todavía está en pruebas.</p>
      <p class="upcoming">iPhone, iPad y Mac — Próximamente</p>
    </main>
    <script>
      const repo = 'Alejogamer12/BRUGES-FINANZAS-360';
      async function loadDownloads() {
        const status = document.querySelector('#status');
        try {
          const headers = {'Accept': 'application/vnd.github+json'};
          let response = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {headers});
          let release;
          if (response.ok) {
            release = await response.json();
          } else {
            response = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=5`, {headers});
            if (!response.ok) throw new Error('No se pudo consultar la descarga.');
            const releases = await response.json();
            release = releases.find((item) => !item.draft);
          }
          if (!release) throw new Error('Todavía no hay una versión publicada.');
          const assets = new Map(release.assets.map((asset) => [asset.name, asset.browser_download_url]));
          const androidUrl = assets.get('BRUGES-FINANZAS-360.apk');
          const windowsUrl = assets.get('BRUGES-FINANZAS-360-Setup.exe');
          if (!androidUrl || !windowsUrl) throw new Error('Los instaladores aún no están disponibles.');
          for (const [selector, url] of [['#android', androidUrl], ['#windows', windowsUrl]]) {
            const link = document.querySelector(selector);
            link.href = url;
            link.removeAttribute('aria-disabled');
          }
          document.querySelector('#beta').hidden = !release.prerelease;
          status.textContent = release.name || release.tag_name;
        } catch (error) {
          status.textContent = error.message;
        }
      }
      loadDownloads();
    </script>
  </body>
</html>
